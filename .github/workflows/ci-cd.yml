name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Base MySQL éphémère, détruite en fin de job. Identifiants factices propres à la CI :
    # aucun secret ni aucune donnée de production n'est utilisé par ce job.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-unused
          MYSQL_DATABASE: dodo_vroum_test
          MYSQL_USER: dodo_test
          MYSQL_PASSWORD: dodo_test
        # Ping TCP : échoue tant que l'initialisation de la base (serveur temporaire sans réseau) n'est pas terminée.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 3306:3306

    # TEST_DATABASE_URL est la seule URL acceptée par src/test/setup-e2e.ts ; DATABASE_URL (Prisma CLI)
    # désigne la même base. MYSQL_USER n'a de droits que sur dodo_vroum_test.
    env:
      TEST_DATABASE_URL: mysql://dodo_test:dodo_test@127.0.0.1:3306/dodo_vroum_test
      DATABASE_URL: mysql://dodo_test:dodo_test@127.0.0.1:3306/dodo_vroum_test
      JWT_SECRET: ci-test-secret-key
      JWT_REFRESH_SECRET: ci-test-refresh-secret-key

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npm run prisma:generate

    # migrate deploy applique les migrations existantes sans en créer et sans réinitialiser la base.
    - name: Apply database migrations
      run: npx prisma migrate deploy

    - name: Verify all migrations are applied
      run: npx prisma migrate status

    - name: Verify migrations match the Prisma schema
      run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

    # Temporaire : eslint.config.mjs fait planter ESLint 8.57 quel que soit le code (anomalie antérieure).
    # Non bloquant jusqu'à la correction de la configuration ESLint ; retirer continue-on-error ensuite.
    - name: Run linting
      run: npm run lint
      continue-on-error: true

    - name: Run unit tests
      run: npm run test

    - name: Run e2e tests
      run: npm run test:e2e

    - name: Generate coverage report
      run: npm run test:cov

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Build Docker image
      run: |
        docker build -t dodovroum-backend:${{ github.sha }} .
        docker tag dodovroum-backend:${{ github.sha }} dodovroum-backend:latest

    - name: Push to registry
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        docker push dodovroum-backend:${{ github.sha }}
        docker push dodovroum-backend:latest

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Run security audit
      run: npm audit --audit-level moderate

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

  deploy-staging:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here

  deploy-production:
    needs: [test, build, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
